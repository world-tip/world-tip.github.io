name: Update fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fixtures
  cancel-in-progress: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"

      - name: Update fixture data
        run: node scripts/update-fixtures.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMPETITION: WC
          FOOTBALL_DATA_SEASON: "2026"
          MIN_REQUESTS_AVAILABLE: "2"

      - name: Commit updated fixtures
        run: |
          if git diff --quiet -- data/fixtures.json; then
            echo "No fixture changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git commit -m "Update fixture data"
          git push
